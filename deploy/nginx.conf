server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  types { application/wasm wasm; }
  gzip on;
  gzip_types application/wasm application/octet-stream application/javascript text/html;
  gzip_min_length 1024;
  location ~* \.(pck|wasm|js|png)$ { add_header Cache-Control "public, max-age=3600"; }
  location / { try_files $uri $uri/ /index.html; }
}
