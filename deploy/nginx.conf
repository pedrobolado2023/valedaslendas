server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # os tipos (html, js, wasm...) vêm do mime.types padrão do nginx; não redefinir "types" aqui
  gzip on;
  gzip_types application/wasm application/octet-stream application/javascript;
  gzip_min_length 1024;
  location ^~ /admin/ { add_header Cache-Control "no-cache"; }   # painel: sempre a versão nova
  location ~* \.(pck|wasm|js|png)$ { add_header Cache-Control "public, max-age=3600"; }
  location / { try_files $uri $uri/ /index.html; }
}
